[project]
name = "QuickBBS"
version = "4.1.0"
authors = [
  { name="Benjamin Schollnick", email="Benjamin@schollnick.net" },
]
description = "Experimental Gallery / File Browser"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/bschollnick/quickbbs"
Issues = "https://github.com/bschollnick/quickbbs/issues"

[tool.black]
line-length = 150

[tool.pyright]
exclude = ["**/gallery/**", "**/albums/**"]

[tool.pylint]
max-line-length = 150
load-plugins = ["pylint_django"]
django-settings-module = "quickbbs.settings"

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
pretty = true
color_output = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^.*/albums/", "^.*/gallery/"]
mypy_path = "quickbbs"

[tool.django-stubs]
django_settings_module = "quickbbs.settings"

[tool.poetry]
# name/version/description live in [project]; duplicating them here had
# the [tool.poetry] copies silently ignored, and the descriptions had
# already drifted apart.

# Without this, Poetry guesses what to package and starts walking the
# repository root -- which holds Albums/, the gallery content tree. Naming
# the seven real Django apps keeps a build fast and keeps user content out
# of any artifact. `benchmarks/` and `tmp/` are deliberately absent: they
# have no __init__.py and are not importable packages.
packages = [
    { include = "quickbbs", from = "quickbbs" },
    { include = "frontend", from = "quickbbs" },
    { include = "interactive_fiction", from = "quickbbs" },
    { include = "thumbnails", from = "quickbbs" },
    { include = "cache_watcher", from = "quickbbs" },
    { include = "filetypes", from = "quickbbs" },
    { include = "user_preferences", from = "quickbbs" },
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.8"
locust = "^2.42.0"
httpx = {extras = ["http2"], version = "^0.28.1"}
black = "^26"
isort = ">=6.0.0"
pylint = "^4.0.5"
pylint-django = ">=2.6.1"
autoflake = "^2.3.1"
pytest = "^9.0.2"
pytest-django = "^4.11.1"
pytest-asyncio = "^1.3.0"
pip-audit = "^2.9.0"
pipdeptree = "^2.28.0"
django-stubs = "^6.0.0"
types-pyyaml = "^6.0.12.20240917"
django-debug-toolbar = "^6.0.0"
mypy = "^2.0.0"
django-extensions = "^4.1"
pytest-cov = "^7.1.0"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/benchmarks/*",
    "*/tests/*",
    "*/tests.py",
    "*/SCRIPT_*.py",
    "quickbbs/conftest.py",
    "quickbbs/manage.py",
    "quickbbs/wsgi.py",
    "quickbbs/quickbbs/wsgi.py",
    "quickbbs/quickbbs/asgi.py",
    "quickbbs/quickbbs/settings.py",
    "quickbbs/quickbbs/quickbbs_settings.py",
    "quickbbs/quickbbs/secrets.py",
    "quickbbs/quickbbs/3rd_party_libraries.py",
    "quickbbs/check_all_file_names.py",
    "quickbbs/check_sha.py",
    "quickbbs/conversions.py",
    "quickbbs/diagnose_sync_issue.py",
    "quickbbs/find_empty_dirs.py",
    "quickbbs/instagram_downloader.py",
    "quickbbs/frontend/file_mover_colors3.py",
    "quickbbs/frontend/organize_by_person_name.py",
    "quickbbs/quickbbs/pdf_repair.py",
]

[tool.isort]
profile = "black"
src_paths = ["quickbbs"]
skip_gitignore = true
known_first_party = ["quickbbs", "frontend", "cache_watcher", "filetypes", "thumbnails", "ink_engine"]

[tool.poetry.dependencies]
python = "^3.12,<3.15"
pymupdf = "^1.24.14"
django-icons = "^26"
django-htmx = "^1.21.0"
humanize = "^4.11.0"
django-jinja = "^2.11.0"
django-grappelli = "^5.0.0"
django-filter = "^25.1"
django-allauth = "^65.2.0"
watchdog = "^6.0.0"
django-ranged-fileresponse = {git = "https://github.com/devmonkey22/django-ranged-fileresponse"}
pillow = "^12.1.1"
markdown2 = "^2.5.1"
numpy = "^2.1.3"
xattr = "^1.1.0"
psycopg = {extras = ["c"], version = "^3.2.3"}
gunicorn = {version = ">=23.0.0", optional = true}
uvicorn = {extras = ["standard"], version = ">=0.37.0", optional = true}
hypercorn = {version = ">=0.17.3", optional = true}
django-compression-middleware = "^0.5.0"
cachetools = "^7"
aiofiles = ">=24.1.0"
pyobjc-core = "^12.0"
# pyobjc = "^12.0"
pyobjc-framework-uniformtypeidentifiers = "^12.0"
pyobjc-framework-cocoa = "^12.0"
ffmpeg-python = "^0.2.0"
charset-normalizer = "^3.4.2"
django = "^6.1"
psycopg-pool = "^3.2.6"
django-dbbackup = "^5.0.0"
pyobjc-framework-scriptingbridge = "^12.0"
pyobjc-framework-quartz = "^12.0"
pyobjc-framework-fsevents = "^12.0"
pyobjc-framework-coreservices = "^12.0"
pyobjc-framework-coremedia = "^12.0"
pyobjc-framework-coreaudio = "^12.0"
pyobjc-framework-avfoundation = "^12.0"
uvloop = "^0.22.1"
django-ai-boost = "^0.8.0"
fido2 = "^2.1.1"
django-dbtasks = "^0.4.0"
granian = {version = "^2.7.2", optional = true}
pyopenssl = "^26.0.0"
colorama = "^0.4.6"
wheel = "^0.47.0"
ink-engine = {path = "../interactive_fiction", develop = true}
pyyaml = "^6.0.3"

[project.optional-dependencies]
# Pick one production server, or "all-servers" to install every option.
# Versions are repeated from [tool.poetry.dependencies] because a PEP 621
# extra carries its own constraint; keep the two in step.
gunicorn = ["gunicorn (>=23.0.0)"]
uvicorn = ["uvicorn[standard] (>=0.37.0)"]
hypercorn = ["hypercorn (>=0.17.3)"]
granian = ["granian (>=2.7.2,<3.0.0)"]
all-servers = [
    "gunicorn (>=23.0.0)",
    "uvicorn[standard] (>=0.37.0)",
    "hypercorn (>=0.17.3)",
    "granian (>=2.7.2,<3.0.0)",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
# E (pycodestyle) and F (pyflakes) only: real errors -- undefined names,
# unused imports, broken syntax. The style families ruff also offers
# disagree with black and isort, which own formatting here.
# Errors, modernisation and correctness families. E501 is black's job, W
# is pycodestyle style, and "I" is dropped because isort owns import order.
select = ["E4", "E7", "E9", "F", "UP", "RUF", "B", "SIM", "PYI", "BLE", "S", "FURB"]

[tool.ruff.lint.per-file-ignores]
# S101: `assert` is how a test asserts. S106: a test fixture's password
# is not a leaked credential.
"**/tests/*" = ["S101", "S106"]
"**/test_*.py" = ["S101", "S106"]
# RUF012: `list_filter`, `search_fields`, `indexes`, `constraints` and
# the rest are Django's own declarative API. The framework reads them off
# the class; annotating them ClassVar is not how Django is written.
"**/admin.py" = ["RUF012"]
"**/models.py" = ["RUF012"]
"quickbbs/quickbbs/directoryindex.py" = ["RUF012"]
# RUF012: `tasks` is Locust's declarative API, same as Django's above.
"quickbbs/benchmarks/locustfile_downloads.py" = ["RUF012"]

# S308/S704: both escape first and re-enable an allowlist of bare tags
# (no attributes), so no attribute-based payload survives. Verified by
# running script/img/onclick/javascript: payloads through them.
"quickbbs/interactive_fiction/admin.py" = ["S308"]
"quickbbs/interactive_fiction/story_markup.py" = ["S704"]
# S108: a fixed lock path is how one worker of many claims the watchdog.
# S101: `x is not None` after logic that already guarantees it --
# narrowing for the type checker, never validation, so stripping them
# under `python -O` changes nothing.
"quickbbs/quickbbs/favorite.py" = ["RUF012", "S101"]
"quickbbs/thumbnails/models.py" = ["RUF012", "S101"]
# S603: a benchmark runs the load-test command it was told to run.
"quickbbs/benchmarks/run_download_benchmark.py" = ["S603"]
# S311: sampling for a benchmark and a random walk through a story's
# choices. Neither is a security decision.
"quickbbs/benchmarks/benchmark_models.py" = ["E402", "S311"]
"quickbbs/interactive_fiction/management/commands/playthrough_harness.py" = ["S311"]
# RUF002/RUF003: an en dash in a numeric range and a multiplication sign
# are the characters meant, not mistyped ASCII.
"quickbbs/cache_watcher/models.py" = ["RUF002"]
"quickbbs/quickbbs/tests/test_bulk_cache_clearing.py" = ["RUF003"]
# SIM115: the handle is passed to FileResponse/SizedFileWrapper, which
# closes it; closing it here would empty the response.
"quickbbs/frontend/serve_up.py" = ["SIM115"]
"quickbbs/quickbbs/fileindex.py" = ["RUF012", "S101", "SIM115"]
"quickbbs/frontend/tests/test_serve_up.py" = ["S101", "S106", "SIM115"]
# SIM115: the lock handle is held for the life of the process, because
# closing it releases the flock. atexit does the cleanup.
"quickbbs/cache_watcher/apps.py" = ["S108", "SIM115"]
# A standalone script must call django.setup() before it can import a
# model, so its model imports cannot sit at the top of the file.
"quickbbs/SCRIPT_test_case_sensitivity.py" = ["E402"]
"quickbbs/check_all_file_names.py" = ["E402"]
"quickbbs/check_sha.py" = ["E402"]
"quickbbs/diagnose_sync_issue.py" = ["E402"]

# These modules import names so that Django can read them as settings.
# Nothing in the module uses them, which is the point.
"quickbbs/quickbbs/settings.py" = ["F401"]
# S104: a self-hosted gallery binds all interfaces on purpose.
"quickbbs/quickbbs/quickbbs_settings.py" = ["F401", "S104"]
