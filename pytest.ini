[pytest]
DJANGO_SETTINGS_MODULE = quickbbs.settings
python_files = tests.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --strict-markers --reuse-db --import-mode=importlib
testpaths = quickbbs
pythonpath = quickbbs
norecursedirs = albums gallery
# ASGI: Enable async test support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    web: Django test-Client/template-level tests (URLconf -> view -> rendered response). Run with `pytest -m web` to check template/view-layer changes.
    api: Model, manager, and engine-level tests that don't go through the Django test Client. Run with `pytest -m api` to check backend/data-layer changes.
